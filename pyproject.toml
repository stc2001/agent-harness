[project]
name = "agent-harness"
version = "0.1.0"
description = "Single-machine local Agent Infrastructure — MVP Phase 1"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "pyjwt>=2.15.1",
    "docker>=7.2.0",
    "pydantic>=2.14.1",
    "openai>=3.41.0",          # for DeepSeek-compatible API calls
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[project.scripts]
harness = "harness.cli.main:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "--cov=harness --cov-report=term-missing --cov-fail-under=60"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
