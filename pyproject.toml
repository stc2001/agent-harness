[project]
name = "agent-harness"
version = "0.1.0"
description = "Single-machine local Agent Infrastructure — MVP Phase 1"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pyjwt>=2.8",
    "docker>=6.1",
    "pydantic>=2.0",
    "openai>=1.0",          # for DeepSeek-compatible API calls
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
harness = "harness.cli.main:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
